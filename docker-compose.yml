version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shadow_db
      MYSQL_USER: shadow_user
      MYSQL_PASSWORD: shadow_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shadow-network

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shadow_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: shadow_user
      SPRING_DATASOURCE_PASSWORD: shadow_password
    depends_on:
      - mysql
    networks:
      - shadow-network

networks:
  shadow-network:
    driver: bridge

volumes:
  mysql_data:
